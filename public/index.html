<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- theme-color is for mobile browsers that support it -->
    <meta name="theme-color" content="#667eea" />
    <meta name="msapplication-navbutton-color" content="#667eea" />
    <meta name="description" content="Yoga Pose Correction AI - Get real-time feedback on your yoga poses using advanced AI analysis" />
    
    <!-- Open Graph tags for better social media sharing -->
    <meta property="og:title" content="Yoga Pose Correction AI" />
    <meta property="og:description" content="Get real-time feedback on your yoga poses using advanced AI analysis" />
    <meta property="og:type" content="website" />
    
    <!-- Apple specific tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yoga Pose AI" />
    
    <!-- Microsoft specific tags -->
    <meta name="msapplication-TileColor" content="#667eea" />
    
    <title>Yoga Pose Correction AI</title>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-block-size: 100vh;
      }
      
      /* Loading screen styles */
      .loading-screen {
        display: flex;
        justify-content: center;
        align-items: center;
        block-size: 100vh;
        color: white;
        flex-direction: column;
        gap: 20px;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-block-start: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; color: white; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this application.</p>
        <p>Yoga Pose Correction AI requires JavaScript for real-time pose analysis and camera functionality.</p>
      </div>
    </noscript>
    
    <!-- Loading screen that shows until React loads -->
    <div id="loading" class="loading-screen">
      <div class="spinner"></div>
      <h2>Loading Yoga Pose AI...</h2>
      <p>Initializing pose detection system</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingElement = document.getElementById('loading');
          if (loadingElement) {
            loadingElement.style.display = 'none';
          }
        }, 1000);
      });
      
      // Error handling for unsupported browsers
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById('loading').innerHTML = `
          <div style="text-align: center; color: white;">
            <h2>Browser Not Supported</h2>
            <p>Your browser does not support camera access.</p>
            <p>Please use Chrome, Firefox, Edge, or Safari to use the live camera features.</p>
            <p>Photo upload will still work for pose analysis.</p>
          </div>
        `;
      }
    </script>
  </body>
</html>
